$schema: https://raw.githubusercontent.com/evilmartians/lefthook/v2.2.2/schema.json

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: ultracite
      run: bun x --no-install ultracite fix {staged_files}
      glob: "**/*.{ts,tsx,json,jsonc,css,html}"
      exclude:
        - "docs/**"
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: knip
      run: bun run knip

    - name: test
      run: bun run test
