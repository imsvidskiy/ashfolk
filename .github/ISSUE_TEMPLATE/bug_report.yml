# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json

name: Bug report
description: Something in the game doesn't work as it should
labels: [ bug ]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected.
      placeholder: A river broke into separate pools when I zoomed out.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page address helps, it holds the seed.
      placeholder: |
        1. Open https://ashfolk.com/?seed=7
        2. Zoom out far

  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on a MacBook Air M3
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
